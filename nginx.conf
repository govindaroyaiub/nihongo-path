server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: any URL that isn't a real file gets index.html,
    # and the app shows the right page in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PWA files: never cache, so phones pick up new versions.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
    }

    # Built JS/CSS have a hash in the name, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}